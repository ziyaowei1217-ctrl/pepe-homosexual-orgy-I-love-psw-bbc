services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["./api/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "api/prisma/schema.prisma"]
    env_file:
      - ${API_ENV_FILE:-api/.env.production}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ${API_ENV_FILE:-api/.env.production}
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_MAP_TILE_URL_TEMPLATE: ${NEXT_PUBLIC_MAP_TILE_URL_TEMPLATE}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_BASE_URL: http://api:4000/api/v1
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
