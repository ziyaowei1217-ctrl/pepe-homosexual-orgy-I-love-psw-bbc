name: Verify connected website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm -C api launch:check
      - run: pnpm -C api test:cli-build
      - run: pnpm audit --prod --audit-level high

  integration-and-containers:
    name: Disposable PostgreSQL, storage, messaging and containers
    runs-on: ubuntu-latest
    # A cold runner compiles the checksum-pinned official storage fixtures.
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://sublet:sublet@localhost:5432/sublet_pipeline?schema=public
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the API database client
        run: pnpm -C api exec prisma generate
      - name: Build pinned disposable storage fixtures
        timeout-minutes: 15
        run: docker compose build minio minio-init
      - name: Start disposable services
        run: |
          docker compose --profile realtime up -d --wait --wait-timeout 120 db minio valkey
          docker compose run --rm --no-deps minio-init
      - name: Apply migrations to the disposable database
        run: pnpm -C api exec prisma migrate deploy
      - name: Check real database, image immutability and distributed quotas
        working-directory: api
        env:
          RUN_DB_SMOKE: "1"
          RUN_MEDIA_SMOKE: "1"
          RUN_VALKEY_SMOKE: "1"
          VALKEY_URL: redis://127.0.0.1:6379
        run: pnpm exec vitest run --no-file-parallelism --maxWorkers=1 test/*.integration.spec.ts test/*schema.spec.ts test/*.migration.spec.ts
      - name: Check marketplace journey with real persistence
        run: pnpm -C api launch:smoke:marketplace
      - name: Check authorized realtime messaging
        run: pnpm -C api launch:smoke:roommate
      - name: Check distributed realtime messaging
        env:
          VALKEY_URL: redis://127.0.0.1:6379
        run: pnpm -C api launch:smoke:valkey
      - name: Build the deployable API image
        run: docker build --file Dockerfile.api --tag psw-verify-api .
      - name: Build the deployable website image
        run: docker build --file Dockerfile.web --tag psw-verify-web .
      - name: Remove disposable services and data
        if: always()
        run: docker compose --profile realtime down --volumes
