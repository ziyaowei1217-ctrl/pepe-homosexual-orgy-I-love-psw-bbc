name: Verify release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm -C api launch:check
      - run: pnpm -C api test:cli-build
      - run: pnpm audit --prod --audit-level high

  integration-and-containers:
    name: PostgreSQL, storage, realtime and container checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://sublet:sublet@localhost:5432/sublet_pipeline?schema=public
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Prepare disposable local services
        run: |
          docker compose --profile realtime up -d --build --wait --wait-timeout 120 db minio valkey
          docker compose run --rm --build minio-init
      - run: pnpm release:check
      - name: Exercise isolated database and media regression suites
        run: pnpm -C api launch:smoke:database
      - run: pnpm -C api launch:smoke:roommate
      - run: pnpm -C api launch:smoke:valkey
        env:
          VALKEY_URL: redis://127.0.0.1:6379
      - name: Build and exercise the hardened application images
        run: node tools/container-smoke.mjs
      - name: Build and click through the isolated fictional website demo
        env:
          NEXT_PUBLIC_WEBSITE_DEMO: "true"
          NEXT_PUBLIC_API_BASE_URL: https://demo.invalid/api/v1
        run: |
          pnpm build
          pnpm test:browser:demo -- http://127.0.0.1:3100 --start-local --output .tmp-tests/website-demo-click-ci
      - name: Clean up the isolated runner services
        if: always()
        run: docker compose --profile realtime down --volumes
