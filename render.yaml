# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Reviewable API-only deployment, checked against the official schema on 2026-10-22.
# This Blueprint selects a FREE service. No resource has been provisioned.
# Run migrations from an authorized operator environment before each release;
# Render's paid-only preDeployCommand is intentionally absent.
# PostgreSQL, TLS Valkey, managed Google authentication and private storage are separate inputs.
previews:
  generation: off

services:
  - type: web
    name: psw-connected-api
    runtime: docker
    branch: connected-demo-2026-10-22
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    numInstances: 1
    autoDeployTrigger: 'off'
    healthCheckPath: /api/v1/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: PAYMENT_MODE
        value: demo
      - key: AUTH_PROVIDER
        value: neon
      - key: PUBLIC_BETA_SIGNUP
        value: "true"
      - key: LOCAL_ADMIN_EMAILS
        value: ""
      - key: AUTH_CODE_TTL_SECONDS
        value: "600"
      - key: AUTH_CODE_MAX_ATTEMPTS
        value: "5"
      - key: AUTH_CODE_COOLDOWN_SECONDS
        value: "60"
      - key: LISTING_MEDIA_UPLOAD_TTL_SECONDS
        value: "600"
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: SECURITY_IDENTIFIER_HASH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: VALKEY_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: TRUSTED_PROXY_HOPS
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: LISTING_MEDIA_STORAGE_ENDPOINT
        sync: false
      - key: LISTING_MEDIA_UPLOAD_ENDPOINT
        sync: false
      - key: LISTING_MEDIA_STORAGE_REGION
        sync: false
      - key: LISTING_MEDIA_STORAGE_BUCKET
        sync: false
      - key: LISTING_MEDIA_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: LISTING_MEDIA_STORAGE_SECRET_ACCESS_KEY
        sync: false
