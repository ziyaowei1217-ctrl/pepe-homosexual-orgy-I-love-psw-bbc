services:
  web:
    image: node:22-alpine
    container_name: sublet-pipeline-web
    restart: unless-stopped
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - sublet_pipeline_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sublet_pipeline

  api:
    image: node:22-alpine
    container_name: sublet-pipeline-api
    restart: unless-stopped
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm --dir api prisma generate && pnpm --dir api prisma db push && pnpm --dir api dev"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://sublet:sublet@db:5432/sublet_pipeline?schema=public
      JWT_SECRET: dev-only-change-me
      WEB_ORIGIN: http://localhost:3000
      EMAIL_CODE_TTL_SECONDS: 600
      EMAIL_CODE_MAX_ATTEMPTS: 5
      EMAIL_CODE_RESEND_COOLDOWN_SECONDS: 60
      LISTING_MEDIA_STORAGE_ENDPOINT: http://minio:9000
      LISTING_MEDIA_UPLOAD_ENDPOINT: http://localhost:9000
      LISTING_MEDIA_STORAGE_REGION: us-east-1
      LISTING_MEDIA_STORAGE_BUCKET: listing-media
      LISTING_MEDIA_STORAGE_ACCESS_KEY_ID: minio
      LISTING_MEDIA_STORAGE_SECRET_ACCESS_KEY: minio-development
      LISTING_MEDIA_UPLOAD_TTL_SECONDS: 600
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - sublet_pipeline_node_modules:/app/node_modules
      - sublet_pipeline_api_dist:/app/api/dist
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sublet_pipeline

  db:
    image: postgres:16-alpine
    container_name: sublet-pipeline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sublet
      POSTGRES_PASSWORD: sublet
      POSTGRES_DB: sublet_pipeline
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - sublet_pipeline_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sublet -d sublet_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - sublet_pipeline

  valkey:
    image: valkey/valkey:8-alpine
    container_name: sublet-pipeline-valkey
    profiles: ["realtime"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - sublet_pipeline

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sublet-pipeline-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-development
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sublet_pipeline_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - sublet_pipeline

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: sublet-pipeline-minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minio minio-development &&
        mc mb --ignore-existing local/listing-media &&
        mc anonymous set none local/listing-media
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - sublet_pipeline

  adminer:
    image: adminer:4
    container_name: sublet-pipeline-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - sublet_pipeline

networks:
  sublet_pipeline:
    driver: bridge

volumes:
  sublet_pipeline_node_modules:
    driver: local
  sublet_pipeline_api_dist:
    driver: local
  sublet_pipeline_pg:
    driver: local
  sublet_pipeline_minio:
    driver: local
